[llm]
provider = openrouter
model = openrouter/o1
base_url = https://openrouter.ai/api/v1
# Base system prompt used for LLM calls (keep non-secret; do not put API keys here)
base_prompt = You are a trading assistant. Follow the project rules and be concise.

[paths]
# Root folder for runtime input/output artifacts
io_dir = ./io
logs_dir = ./io/logs
cache_dir = ./io/cache

[behavior]
# System-wide non-secret defaults
timezone = UTC
max_concurrency = 4
