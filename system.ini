[llm]
provider = openrouter
model = openrouter/o1
base_url = https://openrouter.ai/api/v1
# Base system prompt used for LLM calls (keep non-secret; do not put API keys here)
base_prompt = You are a trading assistant. Follow the project rules and be concise.

[paths]
# Root folder for runtime input/output artifacts
io_dir = ./io
logs_dir = ./io/logs
cache_dir = ./io/cache

[behavior]
# System-wide non-secret defaults
timezone = UTC
max_concurrency = 4

[epochs]
# Multi-epoch training/backtesting loop defaults
default_num_epochs = 3
max_steps_per_epoch = 500
backtest_steps = 252
fee_bps = 10

[memory]
# Redis connection URL (leave blank to use in-process storage)
redis_url =
# RAPTOR: number of chunks between summary passes
raptor_summary_every = 10

